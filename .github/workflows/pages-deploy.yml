name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mermaid/package-lock.json

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('tools/mermaid/package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Cache generated Mermaid SVGs
        uses: actions/cache@v4
        with:
          path: assets/img/mermaid
          key: mermaid-${{ runner.os }}-${{ hashFiles('_posts/**/*.md', 'tools/mermaid/package-lock.json', 'tools/mermaid/render.mjs') }}
          restore-keys: |
            mermaid-${{ runner.os }}-

      - name: Install Mermaid renderer
        working-directory: tools/mermaid
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Install Puppeteer Chromium
        working-directory: tools/mermaid
        run: npx puppeteer browsers install chrome

      - name: Check Chromium dependencies
        working-directory: tools/mermaid
        run: |
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome | head -n 1)
          echo "Chromium: $CHROME"
          ldd "$CHROME" | grep "not found" || true

      - name: Verify Chromium launch
        working-directory: tools/mermaid
        run: node -e "const p=require('puppeteer');(async()=>{const b=await p.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});console.log(await b.version());await b.close();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Cache Jekyll build cache
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('_config.yml', '_data/**', '_posts/**') }}
          restore-keys: |
            jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Verify self-hosted fonts
        run: |
          set -e
          if grep -R "fonts.googleapis.com\|fonts.gstatic.com" _site; then
            echo "Google Fonts reference found in build output"
            exit 1
          fi
          test -f _site/assets/fonts/main.css
          test -f _site/assets/fonts/source-sans-pro-400.woff2
          test -f _site/assets/fontawesome/css/all.min.css
          test -f _site/assets/fontawesome/webfonts/fa-solid-900.woff2
          grep -R "/assets/fonts/main.css" _site >/dev/null
          echo "Self-hosted fonts OK"

      # 内部链接检查已移到 link-check.yml（PR / 手动触发），不再阻塞 Pages 部署
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
